        <script>
            /* loading animation */
            const phrases = [
                "stuff is happening",
                "have you tried SKRBL.ai?",
                "hol up lemme cook",
                "welcome to my website!",
                "hi ;)",
                "optimizing your experience"
            ]

            const loadingTexts = document.getElementById("loading-text");

            if (loadingTexts) {
                const random = Math.floor(Math.random() * phrases.length);
                loadingTexts.textContent = phrases[random];
            }


            window.addEventListener('load', () => {
                const loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.classList.add('fade-out');
                }
                
            
                setTimeout(() => {
                    loader.style.display = 'none';
            }, 500);
            });
        </script>

        <h1> QR Code Generator </h1>
        <div  class="container-box">
            <div class="child-box">
                
                <input type="text" id="qr-input" placeholder="Enter link or text">
                <button onclick="generateQR()" class="btn"> Generate </button>
                
            </div>
        </div>
        <div style="justify-self: center;">
            <div id="qrResult" style="display: none;">
                <div id="qr-display" style="margin: top 20px; "></div>
                <button id="dbtn" class="btn" onclick="downloadQR()"> Download </button>
            </div>
        </div>
        <div class="container-box">
            <div class="child-box">
                <label> Dark Color: <input type="color" id="dark" value="#000000"></label>
                <label> Light Color: <input type="color" id="light" value="#FFFFFF"></label>
            </div>
        </div>
            
                
    
                <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
                <script>
                    
                    

                    function generateQR(){
                        const qrdiv = document.getElementById('qrResult');
                        const data = document.getElementById("qr-input").value;
                        const dark = document.getElementById("dark").value;
                        const light = document.getElementById("light").value;
                        const display = document.getElementById("qr-display");
                        
                    
                        if (data) {
                            display.innerHTML = "";

                            new QRCode(display, {
                                text: data,
                                width: 160,
                                height: 160,
                                colorDark: dark,
                                colorLight: light,
                                correctLevel: QRCode.CorrectLevel.H
                            });

                            qrdiv.style.display = "inline-block";
                        } else {
                            qrdiv.style.display = "none";
                        }
                    }

                    function downloadQR() {
                        const qrImage = document.querySelector("#qr-display img");
                        
                        if (qrImage) {
                            const link = document.createElement("a");
                            link.href = qrImage.src;
                            link.download = "qrcode-cj-dev.png";
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        } else {
                            alert("Please generate a QR code first!");
                        }
                    }
                </script>
            </div>
        </div>
