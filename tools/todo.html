        <style>
    .todo-container { 
        max-width: 800px; 
        margin: 20px auto; 
        padding: 15px; 
        box-sizing: border-box;
    }
    
    .kanban-board {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 20px;
    }

    /* Desktop layout adjustment */
    @media (min-width: 768px) {
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }
    }

    .kanban-column { 
        background: var(--card-bg); 
        padding: 15px; 
        border-radius: 12px; 
        min-height: 150px; 
        box-sizing: border-box;
    }
    
    .kanban-column h3 {
        margin-top: 0;
        color: var(--accent);
        border-bottom: 2px dashed var(--accent);
        padding-bottom: 5px;
        font-size: 1.2rem;
    }

    .todo-item { 
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        background: var(--bg); 
        padding: 12px; 
        margin: 10px 0; 
        border-radius: 8px; 
        cursor: grab; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        word-break: break-word; /* Prevents long text from pushing past screen bounds */
    }
    
    .todo-item:active { cursor: grabbing; }

    .todo-item button { 
        background: #ff4d4d; 
        color: white; 
        border: none; 
        padding: 6px 10px; 
        border-radius: 4px;
        cursor: pointer; 
        font-family: inherit;
        flex-shrink: 0; /* Keeps button from squishing on tight viewports */
    }

    .date-tag { 
        display: block;
        font-size: 0.75rem; 
        color: var(--text-muted); 
        margin-top: 4px;
    }

    #todo-form {
        background: var(--card-bg);
        padding: 15px;
        border-radius: 12px;
        display: flex;
        flex-direction: column; /* Stacks inputs vertically on mobile */
        gap: 10px;
        margin-bottom: 20px;
        box-sizing: border-box;
    }

    @media (min-width: 480px) {
        #todo-form {
            flex-direction: row; /* Row arrangement on tablet/desktop */
        }
    }

    #todo-form input, #todo-form button {
        font-family: inherit;
        padding: 10px; /* Larger hit target for mobile fingers */
        border-radius: 6px;
        border: 1px solid var(--text-muted);
        background: var(--bg);
        color: var(--text);
        font-size: 1rem;
        width: 100%;
        box-sizing: border-box;
    }

    @media (min-width: 480px) {
        #todo-form input[type="text"] { flex: 2; }
        #todo-form input[type="date"] { flex: 1; }
        #todo-form button { flex: 0.5; width: auto; }
    }

    #todo-form button {
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
    }
</style>
        <h1> Cj's To Do Stuff! </h1>
            
                <div class="todo-container">
                    
                    <form id="todo-form" class="admin-content">
                        <input type="text" id="todo-text" placeholder="Task description..." required>
                        <input type="date" id="todo-date" required>
                        <button type="submit">Add Task</button>
                    </form>
            
                    <h3>To Do</h3>
                    <div id="todo-col" class="kanban-column" data-status="todo"></div>

                    <h3>In Progress</h3>
                    <div id="progress-col" class="kanban-column" data-status="progress"></div>

                    <h3>Completed</h3>
                    <div id="done-col" class="kanban-column" data-status="done"></div>
                    </div>
                </div>   
            
    </body>
    <script type="module"> 
        import { db } from '../scripts/firebase-init.js';
        import { ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const todoForm = document.getElementById('todo-form');
        const columns = document.querySelectorAll('[data-status]');

        // Add task to Firebase (Like publishPost)
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const text = document.getElementById('todo-text').value;
            const inputDate = document.getElementById('todo-date').value;
            
            if (!text || !inputDate) return;

            const dateObject = new Date(inputDate);
            const dateString = dateObject.toLocaleDateString('en-US', {
                month: "long",
                day: "numeric",
                year: "numeric",
            });

            const todosRef = ref(db, 'todos');
            const newTodoData = {
                text: text,
                date: dateString,
                status: 'todo',
                timestamp: Date.now()
            };

            push(todosRef, newTodoData)
                .then(() => {
                    console.log("Task successfully saved to Firebase!");
                    todoForm.reset();
                })
                .catch((error) => {
                    console.error("Error saving task to Firebase: ", error);
                });
        });

        // Load tasks from Firebase 
        function loadTodos() {
            const todosRef = ref(db, 'todos');

            onValue(todosRef, (snapshot) => {
                columns.forEach(col => col.innerHTML = ''); 
                const data = snapshot.val();
                
                if (data) {
                    const todoList = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                    
                    // Sort by newest task first within their columns
                    todoList.sort((a, b) => b.timestamp - a.timestamp);

                    todoList.forEach(task => {
                        const item = createTaskDOM(task.id, task);
                        const targetCol = document.querySelector(`[data-status="${task.status}"]`);
                        if (targetCol) targetCol.appendChild(item);
                    });
                }
                setupDragAndDrop();
            }, (error) => {
                console.error("Error loading tasks: ", error);
            });
        }

        function createTaskDOM(id, task) {
            const div = document.createElement('div');
            div.className = 'todo-item';
            div.id = id;
            
            // Checking if admin-mode class exists on body to allow dragging/deleting
            const isAdmin = document.body.classList.contains('admin-mode');
            if (isAdmin) div.setAttribute('draggable', 'true');

            div.innerHTML = `
                <div>
                    <span style="color: var(--text-main);">${task.text}</span>
                    <span class="date-tag">📅 ${task.date}</span>
                </div>
                ${isAdmin ? `<button class="delete-btn">✕</button>` : ''}
            `;

            if (isAdmin) {
                div.querySelector('.delete-btn').addEventListener('click', () => {
                    remove(ref(db, `todos/${id}`));
                });
            }

            return div;
        }

        let draggedItemId = null;
        function setupDragAndDrop() {
            const isAdmin = document.body.classList.contains('admin-mode');
            if (!isAdmin) return;

            document.querySelectorAll('.todo-item').forEach(item => {
                item.addEventListener('dragstart', () => { draggedItemId = item.id; });
            });

            columns.forEach(col => {
                col.addEventListener('dragover', (e) => e.preventDefault());
                col.addEventListener('drop', () => {
                    if (!draggedItemId) return;
                    const targetStatus = col.getAttribute('data-status');
                    update(ref(db, `todos/${draggedItemId}`), { status: targetStatus });
                    draggedItemId = null;
                });
            });
        }

        document.addEventListener('DOMContentLoaded', loadTodos);
    </script>
